<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fdf6f3">
<title>Sem conexão | Luar Make Up</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fdf6f3;color:#2a1713;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;line-height:1.5}
  main{max-width:360px}
  svg{width:64px;height:64px;margin-bottom:8px}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0 0 20px;color:#4b2f27;font-size:16px}

  small{display:block;margin-top:16px;color:#6e5248;font-size:14px}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M31 22.6A13.5 13.5 0 1 1 17.4 6.6a10.5 10.5 0 0 0 13.6 16z" fill="#d9a08b"/></svg>
  <h1>Você está sem internet</h1>

  <button type="button" onclick="location.reload()">Tentar novamente</button>
  <small>Assim que a internet voltar, a loja abre sozinha.</small>
</main>
<script>addEventListener('online',function(){location.reload()})</script>
</body>
